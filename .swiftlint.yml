# SwiftLint configuration for DateTimeExtractor
# Aligned with .swiftformat so `make format` and `make lint` do not fight each other.
disabled_rules:
  - vertical_parameter_alignment
  - identifier_name
  - trailing_whitespace
  - nesting
  # Data-heavy test fixture files may use a file-scoped `// swiftlint:disable
  # line_length` (long data initializers); allow those blanket disables.
  - blanket_disable_command
opt_in_rules:
  - empty_count
  - syntactic_sugar
excluded:
  - .build
  - .swiftpm
force_cast: warning
force_try:
  severity: warning
line_length: 144
type_body_length:
  - 400 # warning
  - 500 # error
file_length:
  warning: 500
  error: 600
type_name:
  min_length: 1 # only warning
  max_length:
    warning: 64
    error: 65
  allowed_symbols: ["_"] # allow underscores in type names
reporter: "xcode"
